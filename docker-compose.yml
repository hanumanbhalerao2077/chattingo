version: '3.9'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0.35
    container_name: chattingo-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chattingo_db}
      MYSQL_USER: ${MYSQL_USER:-chattingo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chattingo_password}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-chattingo_user}", "-p${MYSQL_PASSWORD:-chattingo_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chattingo-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chattingo-backend
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-chattingo_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-chattingo_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-chattingo_password}
      JWT_SECRET: ${JWT_SECRET:-your-secret-jwt-key-change-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:80}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - chattingo-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # React Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chattingo-frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    networks:
      - chattingo-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
    driver: local

networks:
  chattingo-network:
    driver: bridge
