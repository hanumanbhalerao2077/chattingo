# Development Environment Configuration
# This file is for local development

# Database Configuration (Development)
spring.datasource.url=jdbc:mysql://localhost:3306/chattingo
spring.datasource.username=root
spring.datasource.password=password

# JPA Configuration (Development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging (Development)
logging.level.com.chattingo=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS (Development - more permissive)
cors.allowed-origins=http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1:3000

# JWT (Development - shorter expiration)
jwt.expiration=3600000